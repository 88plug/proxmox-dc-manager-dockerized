name: build-and-sign

# Builds the PDM image, pushes to GHCR, attaches an SBOM, signs the image
# with Cosign keyless OIDC, generates SLSA build provenance, and scans the
# result with Trivy. The combination ties the published image digest to a
# specific commit + workflow run that anyone can verify with:
#
#   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner>
#   cosign verify ghcr.io/<owner>/<repo>:<tag> \
#     --certificate-identity-regexp 'https://github.com/<owner>/.*' \
#     --certificate-oidc-issuer    https://token.actions.githubusercontent.com
#
# Trigger model:
#   - push to main → tags "main", "latest", commit sha, build/sign
#   - push tag vX.Y-N (or workflow_dispatch AT that tag ref, which is how
#     iso-bump-detector publishes — its GITHUB_TOKEN tag pushes cannot
#     trigger workflows) → tags "X.Y-N", "X.Y", "latest", commit sha
#   - manual workflow_dispatch on main → same as a main push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Sunday 03:17 UTC. Weekly cache-busted rebuild that re-pulls
    # `debian:trixie-slim` and re-runs `apt-get dist-upgrade`, so the
    # `:edge` tag tracks current Debian Trixie security state without
    # waiting for a maintainer push.
    - cron: '17 3 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents:     read
      packages:     write    # push to GHCR
      id-token:     write    # cosign keyless OIDC
      attestations: write    # SLSA provenance
      security-events: write # Trivy SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The PDM package version is the number users actually shop for, and it
      # no longer tracks the ISO release (the ISO only supplies the base
      # rootfs). Read the pin so every publish carries a :<pdm-version> tag.
      - name: Read pinned PDM version
        id: pdm
        run: |
          set -euo pipefail
          v=$(grep -oE '^ARG PDM_PKG_VERSION=.+' Dockerfile | head -1 | cut -d= -f2)
          [ -n "$v" ] || { echo "FATAL: PDM_PKG_VERSION pin not found in Dockerfile" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # Release tags are vX.Y-N (ISO scheme) — NOT valid semver (no
            # patch component), so type=semver would silently skip them and a
            # release push would publish no version tag at all. type=match
            # handles the actual scheme: v1.1-1 → "1.1-1" and "1.1".
            type=match,pattern=^v(.+)$,group=1
            type=match,pattern=^v(\d+\.\d+),group=1
            # latest: on main pushes AND on release tags (a release is built
            # from a workflow_dispatch at the tag ref — see iso-bump-detector).
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=schedule,pattern=edge
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}}
            type=sha,format=short
            # PDM package version (e.g. "1.1.7") on anything we publish, so
            # users can pin the product version rather than the ISO release.
            type=raw,value=${{ steps.pdm.outputs.version }},enable=${{ github.event_name != 'pull_request' }}

      - name: Resolve build args
        id: args
        run: |
          echo "git_revision=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Deliberately NOT passing steps.meta.outputs.labels: metadata-action's
          # repo-derived defaults (licenses = GitHub-detected MIT, title = repo
          # name, version = git ref) would override the Dockerfile LABEL block,
          # which is the single source of truth for image metadata.
          build-args: |
            GIT_REVISION=${{ steps.args.outputs.git_revision }}
            BUILD_DATE=${{ steps.args.outputs.build_date }}
            IMAGE_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          # Attestations produce a manifest *list*, which the docker exporter
          # cannot load — `load: true` on the PR path failed every pull
          # request with "docker exporter does not currently support
          # exporting manifest lists", killing the job in ~30s before the
          # smoke test below ever ran. Nothing is published from a PR, so
          # provenance/SBOM buy nothing there; keep them for real pushes.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          # Scheduled runs bust the cache so Debian dist-upgrade actually
          # picks up new packages instead of replaying the cached layer.
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: boot the just-built image, wait for the s6 services to
      # come up, and confirm the API is serving /api2/json/ping. Catches
      # boot-time regressions (init-pdm crashes, healthcheck mismatches,
      # broken s6 dependency graphs) without needing a real PVE.
      - name: Smoke test
        if: github.event_name == 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE=$(printf '%s\n' "$TAGS" | head -n1)
          docker run -d --rm --name pdm-smoke \
            -e PDM_ROOT_PASSWORD=ci-only-smoke \
            -p 18443:8443 \
            "$IMAGE"
          trap 'docker logs pdm-smoke >&2 || true; docker rm -f pdm-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            body=$(curl -fsSk https://127.0.0.1:18443/api2/json/ping 2>/dev/null || true)
            # Assert shape, not just status — a future PDM that 200s with
            # an error page (stray reverse proxy, captive portal) wouldn't
            # pass this. {"data":"pong"} is what /api2/json/ping returns.
            if printf '%s' "$body" | grep -q '"data"[[:space:]]*:[[:space:]]*"pong"'; then
              echo "smoke: API ping ok after ${i}s (payload verified)"
              break
            fi
            sleep 1
            if [ "$i" = "60" ]; then
              echo "smoke: API ping never returned expected payload" >&2
              echo "smoke: last response was: ${body:-<empty>}" >&2
              exit 1
            fi
          done
          # Reachability of static UI (separate code path).
          curl -fsSk https://127.0.0.1:18443/ >/dev/null
          echo "smoke: static UI ok"

      - name: Sign image with Cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST:  ${{ steps.build.outputs.digest }}
          TAGS:    ${{ steps.meta.outputs.tags }}
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          # Sigstore's public-good Fulcio/Rekor are a shared free service and
          # do time out — a `context deadline exceeded` on 2026-09-20 left
          # :latest/:edge published but UNSIGNED and un-attested for a week,
          # while SECURITY.md tells users to `cosign verify` it. The image is
          # already pushed by the time we get here, so a bare failure cannot
          # be rolled back; retry instead. Re-signing an already-signed
          # digest is harmless (another signature is attached).
          for tag in $TAGS; do
            for attempt in 1 2 3; do
              if cosign sign --yes --recursive "${tag}@${DIGEST}"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "FATAL: cosign failed 3x for ${tag}@${DIGEST}" >&2
                exit 1
              fi
              echo "cosign attempt ${attempt} failed for ${tag}; retrying in $((attempt * 30))s" >&2
              sleep $((attempt * 30))
            done
          done

      - name: Attest SLSA build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # SECURITY.md hands users a cosign command and tells them it will pass.
      # Run that exact command here so a publish that produced an unverifiable
      # image fails the build instead of sitting green in the Actions tab.
      - name: Verify the published image verifies
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}" > /dev/null
          echo "verified: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'        # report-only; don't fail the build on findings
          ignore-unfixed: true
        if: github.event_name != 'pull_request'

      - name: Upload Trivy SARIF to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          additional_files: 'rootfs/usr/local/bin/pdm-init.sh rootfs/usr/local/sbin/systemctl scripts/smoke-test.sh'
          severity: warning
