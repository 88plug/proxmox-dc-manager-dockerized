name: build-and-sign

# Builds the PDM image, pushes to GHCR, attaches an SBOM, signs the image
# with Cosign keyless OIDC, generates SLSA build provenance, and scans the
# result with Trivy. The combination ties the published image digest to a
# specific commit + workflow run that anyone can verify with:
#
#   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner>
#   cosign verify ghcr.io/<owner>/<repo>:<tag> \
#     --certificate-identity-regexp 'https://github.com/<owner>/.*' \
#     --certificate-oidc-issuer    https://token.actions.githubusercontent.com
#
# Trigger model:
#   - push to main → tag "main", commit sha, build/sign
#   - push tag vX.Y-isoN → tag the release, "latest", commit sha
#   - manual workflow_dispatch → tag "manual-<run_id>"

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents:     read
      packages:     write    # push to GHCR
      id-token:     write    # cosign keyless OIDC
      attestations: write    # SLSA provenance
      security-events: write # Trivy SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Resolve build args
        id: args
        run: |
          echo "git_revision=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REVISION=${{ steps.args.outputs.git_revision }}
            BUILD_DATE=${{ steps.args.outputs.build_date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with Cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST:  ${{ steps.build.outputs.digest }}
          TAGS:    ${{ steps.meta.outputs.tags }}
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes --recursive "${tag}@${DIGEST}"
          done

      - name: Attest SLSA build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'        # report-only; don't fail the build on findings
          ignore-unfixed: true
        if: github.event_name != 'pull_request'

      - name: Upload Trivy SARIF to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          additional_files: 'rootfs/usr/local/bin/pdm-init.sh rootfs/usr/local/sbin/systemctl scripts/smoke-test.sh'
          severity: warning
