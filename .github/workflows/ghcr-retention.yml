name: ghcr-retention

# Monthly cleanup of GHCR image versions to keep the registry from filling
# up over years of weekly + per-commit builds. Retention policy:
#
#   - Always keep: any tag matching v* (versioned releases), main, latest, edge.
#   - Keep the most recent 8 weekly-YYYYMMDD tags (~2 months).
#   - Keep the most recent 30 sha-* short-sha tags (~most recent month
#     of commits).
#   - Delete every untagged image manifest (orphaned by tag retags).
#
# Uses GitHub's container registry API directly via gh CLI so we don't
# add a third-party action to the trust surface.

on:
  schedule:
    - cron: '23 5 1 * *'   # first of the month, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pkgName = repo;  // image name = repo name

            // Decide whether the package is user-owned or org-owned.
            let isOrg = false;
            try {
              await github.rest.orgs.get({ org: owner });
              isOrg = true;
            } catch (e) {
              isOrg = false;
            }

            const listFn = isOrg
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;
            const delFn = isOrg
              ? github.rest.packages.deletePackageVersionForOrg
              : github.rest.packages.deletePackageVersionForUser;
            const ownerKey = isOrg ? 'org' : 'username';

            const versions = await github.paginate(listFn, {
              package_type: 'container',
              package_name: pkgName,
              [ownerKey]: owner,
              per_page: 100,
            });

            const keepAlways = (t) =>
              t === 'main' || t === 'latest' || t === 'edge' ||
              /^v\d/.test(t);

            const weekly = [];
            const shaTags = [];
            const untagged = [];
            const releases = [];

            for (const v of versions) {
              const tags = (v.metadata && v.metadata.container && v.metadata.container.tags) || [];
              if (tags.length === 0) { untagged.push(v); continue; }
              if (tags.some(keepAlways)) { releases.push(v); continue; }
              if (tags.some(t => /^weekly-\d{8}$/.test(t))) { weekly.push(v); continue; }
              if (tags.some(t => /^sha-[a-f0-9]+$/.test(t))) { shaTags.push(v); continue; }
              // Anything else (pr-N etc.): treat as transient.
              shaTags.push(v);
            }

            const byNewest = (a, b) => new Date(b.created_at) - new Date(a.created_at);
            weekly.sort(byNewest);
            shaTags.sort(byNewest);

            const toDelete = []
              .concat(untagged)
              .concat(weekly.slice(8))
              .concat(shaTags.slice(30));

            core.info(`releases kept: ${releases.length}`);
            core.info(`weekly kept:   ${Math.min(weekly.length, 8)} / ${weekly.length}`);
            core.info(`sha   kept:    ${Math.min(shaTags.length, 30)} / ${shaTags.length}`);
            core.info(`marked for deletion: ${toDelete.length}`);

            for (const v of toDelete) {
              try {
                await delFn({
                  package_type: 'container',
                  package_name: pkgName,
                  [ownerKey]: owner,
                  package_version_id: v.id,
                });
                core.info(`deleted #${v.id} (${(v.metadata?.container?.tags || []).join(',') || 'untagged'})`);
              } catch (e) {
                core.warning(`failed to delete #${v.id}: ${e.message}`);
              }
            }
