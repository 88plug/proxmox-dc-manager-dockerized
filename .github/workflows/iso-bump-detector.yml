name: iso-bump-detector

# Polls download.proxmox.com daily for a newer Proxmox Datacenter Manager
# ISO. When one appears, this workflow:
#   1. Updates the pins (PDM_ISO_URL, PDM_ISO_SHA256, README) on a worktree.
#   2. Runs a full verification build — including the extractor's sha256 +
#      GPG check against the pinned Trixie release key.
#   3. Boots the verified image and confirms /api2/json/ping responds.
#   4. Pushes the bump commit directly to main and creates a vX.Y-N tag.
#
# Pushing instead of opening a PR keeps the operation fully hands-off:
# no "auto-merge" repo setting needed, no required-reviewers bypass.
# Safety is preserved because the verification build in step 2 runs
# the same GPG check (against the same pinned key) that the runtime
# build would, so a tampered ISO cannot reach main.
#
# GITHUB_TOKEN pushes never trigger other workflows, so after tagging
# the workflow explicitly dispatches build-and-sign.yml at the new tag,
# which publishes the signed/attested/scanned versioned image to GHCR.

on:
  schedule:
    - cron: '17 4 * * *'   # daily 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push commit + tag
      actions:  write   # to dispatch build-and-sign at the new tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Detect newest published ISO
        id: detect
        run: |
          set -euo pipefail

          current_url=$(grep -oE 'PDM_ISO_URL=[^[:space:]]+' Dockerfile | head -1 | cut -d= -f2)
          current_iso=$(basename "$current_url")
          current_ver=$(echo "$current_iso" | sed -E 's/^proxmox-datacenter-manager_(.*)\.iso$/\1/')
          current_sha=$(grep -oE 'PDM_ISO_SHA256=[a-f0-9]+' Dockerfile | head -1 | cut -d= -f2)

          listing=$(curl -fsSL http://download.proxmox.com/iso/)
          latest_iso=$(printf '%s\n' "$listing" \
            | grep -oE 'proxmox-datacenter-manager_[0-9]+\.[0-9]+-[0-9]+\.iso' \
            | sort -uV | tail -n1 || true)

          if [ -z "$latest_iso" ]; then
            # Listing came back, but the strict regex matched nothing. This is
            # the durability hazard the agents flagged: a future Proxmox
            # filename rename (e.g. `pdm_1.1-0.iso`) would silently make this
            # workflow exit 0 forever, and the ISO pin would rot indefinitely
            # with no failure signal in the Actions tab. Fail loudly instead.
            # The maintainer's only "you need to look at this" surface is a
            # red X on the iso-bump-detector run — make sure it shows up.
            looser=$(printf '%s\n' "$listing" \
              | grep -oE 'proxmox-datacenter-manager[^"<>]*\.iso' \
              | sort -u | head -5 || true)
            echo "FATAL: strict ISO regex matched zero filenames in a non-empty listing." >&2
            echo "Proxmox may have renamed the ISO. Loose matches found (if any):" >&2
            printf '  %s\n' "${looser:-<none>}" >&2
            echo "Update the regex in this workflow and the iso-bump-detector will resume." >&2
            exit 1
          fi

          latest_ver=$(echo "$latest_iso" | sed -E 's/^proxmox-datacenter-manager_(.*)\.iso$/\1/')
          echo "current=$current_iso  latest=$latest_iso"

          if [ "$current_iso" = "$latest_iso" ]; then
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse to downgrade (paranoia: published listing could omit
          # newer versions briefly during a re-spin).
          if [ "$(printf '%s\n%s\n' "$current_ver" "$latest_ver" | sort -V | tail -n1)" = "$current_ver" ]; then
            echo "current pin ($current_ver) >= latest published ($latest_ver) — skipping"
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_sha=$(curl -fsSL "http://download.proxmox.com/iso/${latest_iso}.sha256" | awk '{print $1; exit}')
          if [ -z "$new_sha" ] || [ "${#new_sha}" != "64" ]; then
            echo "sidecar returned unexpected sha256: $new_sha" >&2
            exit 1
          fi

          if ! curl -fsSI "http://download.proxmox.com/iso/${latest_iso}.asc" >/dev/null; then
            echo "no .asc sidecar — verification build would fail; aborting bump" >&2
            exit 1
          fi

          {
            echo "needs_bump=true"
            echo "current_iso=$current_iso"
            echo "current_ver=$current_ver"
            echo "current_sha=$current_sha"
            echo "latest_iso=$latest_iso"
            echo "latest_ver=$latest_ver"
            echo "new_sha=$new_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Apply pin bump
        if: steps.detect.outputs.needs_bump == 'true'
        env:
          CURRENT_ISO: ${{ steps.detect.outputs.current_iso }}
          CURRENT_SHA: ${{ steps.detect.outputs.current_sha }}
          LATEST_ISO:  ${{ steps.detect.outputs.latest_iso }}
          NEW_SHA:     ${{ steps.detect.outputs.new_sha }}
          LATEST_VER:  ${{ steps.detect.outputs.latest_ver }}
        run: |
          set -euo pipefail
          for f in Dockerfile compose.yaml README.md REPRODUCIBILITY.md; do
            sed -i "s|${CURRENT_ISO}|${LATEST_ISO}|g" "$f"
          done
          sed -i "s|PDM_ISO_SHA256=${CURRENT_SHA}|PDM_ISO_SHA256=${NEW_SHA}|"  Dockerfile
          sed -i "s|PDM_ISO_SHA256: ${CURRENT_SHA}|PDM_ISO_SHA256: ${NEW_SHA}|" compose.yaml
          sed -i "s|\`${CURRENT_SHA}\`|\`${NEW_SHA}\`|"                         README.md
          # Keep the filename-derivable OCI labels and the README version text
          # from rotting on auto-bumps. iso.kernel / iso.debian are NOT
          # derivable from the filename and stay manual (see Dockerfile).
          rel="${LATEST_VER%-*}"; isorel="${LATEST_VER##*-}"
          sed -i -E "s|(org.opencontainers.image.version=\")[^\"]+|\1${rel}-iso${isorel}|" Dockerfile
          sed -i -E "s|(com.proxmox.iso.release=\")[^\"]+|\1${rel}|"                Dockerfile
          sed -i -E "s|(com.proxmox.iso.isorelease=\")[^\"]+|\1${isorel}|"          Dockerfile
          sed -i -E "s|PDM [0-9.]+, ISO release [0-9]+|PDM ${rel}, ISO release ${isorel}|" README.md
          git --no-pager diff -- Dockerfile compose.yaml README.md REPRODUCIBILITY.md

      - name: Verification build (exercises full GPG + smoke)
        if: steps.detect.outputs.needs_bump == 'true'
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build -t pdm-verify:bump \
            --build-arg GIT_REVISION="$(git rev-parse --short=12 HEAD)" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .
          docker run -d --rm --name pdm-verify \
            -e PDM_ROOT_PASSWORD=verify-ci-only \
            -p 18443:8443 \
            pdm-verify:bump
          trap 'docker logs pdm-verify >&2 || true; docker rm -f pdm-verify >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 90); do
            body=$(curl -fsSk https://127.0.0.1:18443/api2/json/ping 2>/dev/null || true)
            # Same shape assertion as the runtime healthcheck. Critical here
            # because this is the only gate before the bot pushes to main.
            if printf '%s' "$body" | grep -q '"data"[[:space:]]*:[[:space:]]*"pong"'; then
              echo "ping ok after ${i}s (payload verified)"; ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "verification: /api2/json/ping never returned expected payload" >&2
            echo "verification: refusing to push bump — PDM API contract may have changed" >&2
            exit 1
          fi

      - name: Commit + push to main and tag release
        if: steps.detect.outputs.needs_bump == 'true'
        env:
          NEW_VER:  ${{ steps.detect.outputs.latest_ver }}
          OLD_VER:  ${{ steps.detect.outputs.current_ver }}
          NEW_SHA:  ${{ steps.detect.outputs.new_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "iso-bump-bot"
          git config user.email "iso-bump-bot@users.noreply.github.com"
          git add Dockerfile compose.yaml README.md REPRODUCIBILITY.md
          git commit -m "chore: bump PDM ISO ${OLD_VER} → ${NEW_VER}

          Auto-detected by .github/workflows/iso-bump-detector.yml and
          verified by a full image build (sha256 + GPG against the pinned
          Trixie release key) plus a runtime smoke test (/api2/json/ping)
          before push.

          New sha256: ${NEW_SHA}"
          git push origin main
          tag="v${NEW_VER}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag"
            # Pushes made with GITHUB_TOKEN never trigger other workflows
            # (GitHub's recursion guard), so the tag push alone would NOT
            # start build-and-sign and no release image would ever publish.
            # workflow_dispatch is the documented exception — dispatch the
            # publish run explicitly at the new tag ref.
            gh workflow run build-and-sign.yml --ref "$tag"
            echo "tagged $tag and dispatched build-and-sign at it"
          else
            echo "tag $tag already exists; skipping"
          fi
