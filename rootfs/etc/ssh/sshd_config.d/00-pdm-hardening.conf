# PDM container sshd hardening. Applied automatically; do not edit at runtime —
# changes will be lost on container recreation. To override, drop a higher-
# numbered file into /etc/ssh/sshd_config.d/ via the rootfs/ overlay.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
ChallengeResponseAuthentication no
UsePAM yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PrintMotd no
MaxAuthTries 3
LoginGraceTime 30
