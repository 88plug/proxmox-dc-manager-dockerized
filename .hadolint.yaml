# Deliberate deviations, with reasons. The CI lint job runs at
# failure-threshold: warning, so every ignore here must justify itself.
ignored:
  # DL3008 (pin apt versions): this image runs `apt-get dist-upgrade` on every
  # build precisely so the Debian base tracks current security state between
  # ISO releases. Pinning package versions would defeat that design; the ISO
  # itself is the version pin (sha256 + GPG verified).
  - DL3008
  # DL4006 (set pipefail before piped RUN): /bin/sh is dash in both stages.
  # Every pipeline's tail is a verification step (sha256sum -c, grep -qx
  # fingerprint match) that fails the build if an upstream stage produced
  # nothing, so a silent mid-pipe failure cannot slip through.
  - DL4006
  # DL3003 (use WORKDIR instead of cd): the `cd /tmp` in the s6-overlay
  # install is scoped to one RUN on purpose — WORKDIR would persist /tmp as
  # the final image's working directory.
  - DL3003
